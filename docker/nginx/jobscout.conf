events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr;
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $http_upgrade $connection_upgrade { default upgrade; '' ''; }
    # A trusted outer TLS proxy must replace client-supplied forwarded headers.
    map $http_x_forwarded_proto $forwarded_proto { default $scheme; "~*^https$" https; }
    server {
        listen 2026;
        server_name _;
        set $gateway_upstream gateway:8001;
        set $frontend_upstream frontend:3000;
        root /usr/share/nginx/jobscout;
        client_max_body_size 100m;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        location = / { try_files /index.html =404; add_header Cache-Control "no-cache"; }
        location = /index.html { add_header Cache-Control "no-cache"; }
        location = /app.js { add_header Cache-Control "no-cache"; }
        location ~ ^/(core|api-client|tracker-state)\.js$ { try_files $uri =404; add_header Cache-Control "no-cache"; }
        location = /style.css { add_header Cache-Control "no-cache"; }
        location = /runtime-config.js { add_header Cache-Control "no-store"; }
        location /api/langgraph/ {
            rewrite ^/api/langgraph/(.*) /api/$1 break;
            proxy_pass http://$gateway_upstream;
        }
        location /api/ { proxy_pass http://$gateway_upstream; }
        location /health { proxy_pass http://$gateway_upstream; }
        # Next.js assets, auth and Capability Center share this same origin.
        location / { proxy_pass http://$frontend_upstream; }
    }
}
