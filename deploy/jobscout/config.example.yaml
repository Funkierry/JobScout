# Personal / trusted-user JobScout deployment. Secrets come from .jobscout/.env.
config_version: 46
log_level: info
models:
  - name: jobscout
    display_name: JobScout
    use: langchain_openai:ChatOpenAI
    model: $JOBSCOUT_MODEL
    api_key: $JOBSCOUT_MODEL_API_KEY
    base_url: $JOBSCOUT_MODEL_BASE_URL
    timeout: 120
    max_retries: 2
    supports_vision: false
tool_groups:
  - name: web
  - name: file:read
  - name: file:write
tools:
  - name: web_search
    group: web
    use: deerflow.community.ddg_search.tools:web_search_tool
    max_results: 5
  - name: web_fetch
    group: web
    use: deerflow.community.jina_ai.tools:web_fetch_tool
  - name: ls
    group: file:read
    use: deerflow.sandbox.tools:ls_tool
  - name: read_file
    group: file:read
    use: deerflow.sandbox.tools:read_file_tool
  - name: write_file
    group: file:write
    use: deerflow.sandbox.tools:write_file_tool
  - name: str_replace
    group: file:write
    use: deerflow.sandbox.tools:str_replace_tool
sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
skills:
  path: /app/skills
extensions:
  middlewares:
    - app.jobscout.middleware:JobScoutLinkMiddleware
auth:
  local:
    allow_registration: false
database:
  backend: sqlite
  sqlite_dir: /data/data
run_events:
  backend: db
scheduler:
  enabled: false
token_usage:
  enabled: true
token_budget:
  enabled: true
  max_tokens: 200000
recursion_limit: 100
max_recursion_limit: 150
llm_call:
  max_concurrent_calls: 3
