name: JobScout deployment
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/app/**'
      - 'backend/uv.lock'
      - 'backend/pyproject.toml'
      - 'backend/Dockerfile'
      - 'backend/scripts/jobscout_container.py'
      - 'scripts/jobscout*.py'
      - 'jobscout-web/**'
      - 'deploy/jobscout/**'
      - 'docker/**'
      - 'skills/public/**'
      - '.dockerignore'
      - '.github/workflows/jobscout-deploy.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/jobscout-deploy.yml'
      - 'deploy/jobscout/**'
      - 'docker/docker-compose.jobscout*.yaml'
      - 'docker/nginx/jobscout.conf'
      - 'backend/Dockerfile'
      - 'backend/app/**'
      - 'backend/uv.lock'
      - 'backend/pyproject.toml'
      - 'backend/scripts/jobscout_container.py'
      - 'scripts/jobscout*.py'
      - 'jobscout-web/**'
      - '.dockerignore'
      - 'skills/public/**'
permissions:
  contents: read
concurrency:
  group: jobscout-deploy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Initialize synthetic deployment
        run: |
          python scripts/jobscout.py init
          python - <<'PY'
          from pathlib import Path
          p = Path('.jobscout/.env')
          text = p.read_text().replace('your-model-id', 'fixture-model').replace('replace-me', 'synthetic-key-not-a-credential').replace('https://your-provider.example/v1', 'https://model.invalid/v1')
          p.write_text(text)
          PY
      - name: Pure frontend checks
        run: node jobscout-web/test_pure.js
      - name: Build and wait for all services
        run: python scripts/jobscout.py up
      - name: Fresh-instance smoke (no model calls)
        run: python scripts/jobscout_smoke.py
      - name: Browser runtime and restart persistence
        run: |
          docker compose --project-name jobscout --env-file .jobscout/.env -f docker/docker-compose.jobscout.yaml exec -T gateway /app/backend/.venv/bin/python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(); page=b.new_page(); page.set_content('<title>JobScout fixture</title>'); assert page.title()=='JobScout fixture'; b.close(); p.stop(); print('Chromium ready')"
          python scripts/jobscout.py down
          python - <<'PY'
          from pathlib import Path
          p = Path('.jobscout/.env')
          p.write_text(p.read_text().replace('JOBSCOUT_BROWSER_LOGIN=0', 'JOBSCOUT_BROWSER_LOGIN=1'))
          PY
          python scripts/jobscout.py up
          docker compose --project-name jobscout --env-file .jobscout/.env -f docker/docker-compose.jobscout.yaml exec -T gateway /app/backend/.venv/bin/python -c "import os; from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=False, env={**os.environ, 'DISPLAY': ':99'}); page=b.new_page(); page.set_content('<title>Login fixture</title>'); assert page.title()=='Login fixture'; b.close(); p.stop(); print('Headed Chromium ready')"
          python - <<'PY'
          import json, urllib.request
          status = json.load(urllib.request.urlopen('http://127.0.0.1:2026/api/v1/auth/setup-status'))
          assert status['needs_setup'] is False
          assert urllib.request.urlopen('http://127.0.0.1:6080/vnc.html').status == 200
          print('Administrator survived compose down/up')
          PY
      - name: Backup and restore into a fresh volume
        run: |
          python scripts/jobscout.py backup
          python scripts/jobscout.py down
          python - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('.jobscout/.env')
          p.write_text(p.read_text().replace('JOBSCOUT_DATA_VOLUME=jobscout_jobscout-data', 'JOBSCOUT_DATA_VOLUME=jobscout-restored-data'))
          archive = next(Path('.jobscout/backups').glob('*.tar.gz'))
          subprocess.run(['python', 'scripts/jobscout.py', 'restore', '--archive', str(archive)], check=True)
          PY
          python scripts/jobscout.py up
          python - <<'PY'
          import json, urllib.request
          status = json.load(urllib.request.urlopen('http://127.0.0.1:2026/api/v1/auth/setup-status'))
          assert status['needs_setup'] is False
          print('Administrator restored into a fresh data volume')
          PY
      - name: Package the tested application as commit-tagged images
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          python scripts/jobscout.py down
          prefix="ghcr.io/${REPOSITORY,,}"
          tag="sha-${COMMIT}"
          echo "JOBSCOUT_RELEASE_PREFIX=${prefix}" >> "$GITHUB_ENV"
          echo "JOBSCOUT_RELEASE_TAG=${tag}" >> "$GITHUB_ENV"
          docker build -f deploy/jobscout/gateway.Dockerfile --label "org.opencontainers.image.source=https://github.com/${REPOSITORY}" --label "org.opencontainers.image.revision=${COMMIT}" -t "${prefix}-gateway:${tag}" .
          docker build -f deploy/jobscout/web.Dockerfile --label "org.opencontainers.image.source=https://github.com/${REPOSITORY}" --label "org.opencontainers.image.revision=${COMMIT}" -t "${prefix}-web:${tag}" .
          docker tag jobscout-frontend:latest "${prefix}-capabilities:${tag}"
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path('.jobscout/.env')
          p.write_text(p.read_text() + '\nJOBSCOUT_DEPLOY_MODE=images\nJOBSCOUT_IMAGE_PREFIX=ghcr.io/' + os.environ['REPOSITORY'].lower() + '\nJOBSCOUT_IMAGE_TAG=sha-' + os.environ['COMMIT'] + '\nJOBSCOUT_DATA_VOLUME=jobscout-image-data\n')
          PY
      - name: Start packaged images and verify no source mounts
        run: |
          python scripts/jobscout.py up --no-pull
          python scripts/jobscout_smoke.py
          python - <<'PY'
          import importlib.util, json, subprocess, urllib.request
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('deploy', 'scripts/jobscout.py')
          deploy = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(deploy)
          directory = Path('.jobscout').resolve()
          config = json.loads(deploy.compose(directory, ['config', '--format', 'json'], check=True, capture_output=True, text=True).stdout)
          services = config['services']
          for service in ('gateway', 'frontend', 'nginx'):
              assert 'build' not in services[service]
          assert {v['target'] for v in services['gateway']['volumes']} == {'/config/config.yaml', '/config/extensions_config.json', '/data'}
          assert {v['target'] for v in services['nginx']['volumes']} == {'/usr/share/nginx/jobscout/runtime-config.js'}
          deploy.compose(directory, ['exec', '-T', 'gateway', '/app/backend/.venv/bin/python', '-c', "from pathlib import Path; assert list(Path('/app/skills/public').glob('*/SKILL.md'))"], check=True)
          for name in ('core', 'api-client', 'tracker-state'):
              response = urllib.request.urlopen('http://127.0.0.1:2026/' + name + '.js')
              assert response.status == 200 and 'javascript' in response.headers['Content-Type']
          print('Packaged assets and public skills ready; no application source bind mounts')
          PY
      - name: Sign in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested commit images
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          for component in gateway capabilities web; do
            docker push "${JOBSCOUT_RELEASE_PREFIX}-${component}:${JOBSCOUT_RELEASE_TAG}"
          done
          echo "Published image tag: \`${JOBSCOUT_RELEASE_TAG}\` (linux/amd64)" >> "$GITHUB_STEP_SUMMARY"
      - name: Service diagnostics
        if: failure()
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('deploy', 'scripts/jobscout.py')
          deploy = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(deploy)
          deploy.compose(Path('.jobscout').resolve(), ['logs', '--tail', '80'])
          PY
      - name: Stop disposable services
        if: always()
        run: python scripts/jobscout.py down
